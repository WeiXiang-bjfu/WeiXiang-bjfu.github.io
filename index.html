<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Academic website of Dr. Wei XIANG, Full Professor in the College of Forestry and Vice Dean of both the College of Forestry and the Graduate School at Beijing Forestry University.">
  <meta name="author" content="Dr. Wei XIANG">
  <meta name="theme-color" content="#102d24">
  <link rel="canonical" href="https://weixiang-bjfu.github.io/">
  <title>Dr. Wei XIANG | Beijing Forestry University</title>
  <link rel="stylesheet" href="/forest-home-v3.css?v=20260817-5">
  <style>
    .site-loading{min-height:100vh;display:grid;place-items:center;background:#102d24;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:24px}
    .site-loading h1{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px;font-size:42px}
    .site-loading p{margin:0;color:rgba(255,255,255,.75)}
  </style>
</head>
<body>
  <main class="site-loading">
    <div>
      <h1>Dr. Wei XIANG</h1>
      <p>Loading academic homepage…</p>
    </div>
  </main>

  <script>
    (() => {
      const displayName = 'Dr. Wei XIANG';
      const biographyText = [
        'I am a Full Professor in the College of Forestry and serve as Vice Dean of both the College of Forestry and the Graduate School at Beijing Forestry University. My research focuses on forest growth modelling, forest dynamics, and the multifunctional management of natural forests.',
        'Using natural mixed forests as my primary study system, I combine statistical modelling and simulation approaches to investigate how tree competition, climate change, and silvicultural interventions affect stand growth, structural dynamics, and ecosystem multifunctionality. My work integrates multiple data sources, including long-term permanent-plot records, tree-ring data, LiDAR point clouds, and remote-sensing observations.',
        'My research integrates quantitative forest science with adaptive management to support precise, data-driven, and multifunctional management of natural and near-natural mixed forests under environmental change.'
      ];

      const loadScript = (src) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });

      const applyProfile = () => {
        document.title = `${displayName} | Beijing Forestry University`;

        const description = document.querySelector('meta[name="description"]');
        const author = document.querySelector('meta[name="author"]');
        if (description) description.content = 'Academic website of Dr. Wei XIANG, Full Professor in the College of Forestry and Vice Dean of both the College of Forestry and the Graduate School at Beijing Forestry University.';
        if (author) author.content = displayName;

        const siteName = document.querySelector('.site-name');
        const profileName = document.querySelector('.profile-column h1');
        const portrait = document.querySelector('.portrait-photo');
        const role = document.querySelector('.role');
        const secondaryRole = document.querySelector('.secondary-role');
        const biography = document.querySelectorAll('.bio-column > p');

        if (siteName) siteName.textContent = displayName;
        if (profileName) profileName.textContent = displayName;
        if (portrait) portrait.alt = displayName;
        if (role) role.textContent = 'Full Professor · Forest Management & Modelling';
        if (secondaryRole) secondaryRole.textContent = 'Vice Dean, College of Forestry · Vice Dean, Graduate School';

        biography.forEach((paragraph, index) => {
          if (biographyText[index]) paragraph.textContent = biographyText[index];
        });

        const firstAppointment = document.querySelector('#experience .experience-item');
        if (firstAppointment) {
          const appointmentRole = firstAppointment.querySelector('.experience-role');
          const appointmentDescription = firstAppointment.querySelector('.experience-role + p');
          if (appointmentRole) appointmentRole.textContent = 'College of Forestry · Lecturer, Associate Professor and Full Professor; currently Vice Dean, Doctoral Supervisor, and Vice Dean of the Graduate School';
          if (appointmentDescription) appointmentDescription.textContent = 'Research, teaching and academic leadership in forest management, forest growth modelling, natural forest dynamics, restoration and dendroecology.';
        }

        document.querySelectorAll('.contact-details p').forEach((row) => {
          const label = row.querySelector('span');
          if (!label) return;
          if (label.textContent.trim() === 'School') {
            label.textContent = 'College';
            const textNode = Array.from(row.childNodes).find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
            if (textNode) textNode.textContent = 'College of Forestry';
          }
        });

        document.querySelectorAll('*').forEach((element) => {
          if (element.children.length === 0 && element.textContent.trim() === 'School of Forestry') {
            element.textContent = 'College of Forestry';
          }
        });

        const footerName = document.querySelector('.footer-row span:first-child');
        if (footerName) footerName.textContent = `© ${new Date().getFullYear()} ${displayName}`;
      };

      fetch('/site-content-v5.html?v=20260817-5', {cache: 'no-store'})
        .then((response) => {
          if (!response.ok) throw new Error(`Unable to load homepage content: ${response.status}`);
          return response.text();
        })
        .then((html) => {
          const source = new DOMParser().parseFromString(html, 'text/html');
          source.querySelectorAll('script').forEach((script) => script.remove());
          document.body.innerHTML = source.body.innerHTML;
          applyProfile();
          return loadScript('/photo-fix.js?v=20260817-5');
        })
        .then(() => loadScript('/app.js?v=20260817-5'))
        .then(applyProfile)
        .catch((error) => {
          console.error(error);
          document.body.innerHTML = '<main class="site-loading"><div><h1>Dr. Wei XIANG</h1><p>The academic website is temporarily unavailable.</p></div></main>';
        });
    })();
  </script>
</body>
</html>
